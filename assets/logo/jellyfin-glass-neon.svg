<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="15"/>
    </clipPath>
  </defs>
  <!-- dark glass tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0e0f14"/>
  <!-- warm neon glow of the Jellyfin triangle, clipped to the tile -->
  <g clip-path="url(#tile)">
    <path d="M32 13 L52 48 H12 Z" fill="url(#jf)" stroke="url(#jf)" stroke-width="6.5" stroke-linejoin="round" filter="url(#glow)" opacity=".9"/>
  </g>
  <!-- glass triangle outline -->
  <path d="M32 13 L52 48 H12 Z" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".85" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- inner solid triangle -->
  <path d="M32 31 L40.5 44 H23.5 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- tile hairline -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
</svg>
